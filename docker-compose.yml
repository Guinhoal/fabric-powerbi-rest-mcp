services:
  fabric-powerbi-mcp:
    build: .
    container_name: fabric-powerbi-mcp
    restart: unless-stopped
    ports:
      - "18273:8000"
    environment:
      MCP_TRANSPORT: http
      PORT: "8000"
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      MCP_API_KEY: ${MCP_API_KEY}
      MCP_LOG_FILE: /var/log/mcp/debug.log
    volumes:
      - fabric-mcp-logs:/var/log/mcp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared-mcp:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-mcp
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://fabric-powerbi-mcp:8000
    depends_on:
      - fabric-powerbi-mcp

volumes:
  fabric-mcp-logs:
